services:
  minio:
    # S3-compatible storage for local development (console: http://localhost:9001)
    image: minio/minio:RELEASE.2024-10-02T17-50-41Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]

  create-bucket:
    image: minio/mc:RELEASE.2024-10-02T08-27-28Z
    depends_on: [minio]
    entrypoint: >
      sh -c "sleep 3 && mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/files"

  clamav:
    image: clamav/clamav:1.4
    ports: ["3310:3310"]

  api:
    build: .
    environment:
      S3_BUCKET: files
      S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-at-least-32-chars}
      CLAMAV_HOST: clamav
    ports: ["3000:3000"]
    depends_on: [create-bucket, clamav]
